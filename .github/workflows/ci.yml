name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pypdf

      - name: Validate Knowledge Base
        run: python -m brandguardian check-kb

      - name: Run unit & integration tests
        run: python -m unittest discover -s tests

      - name: Run line coverage check
        if: matrix.python-version == '3.12'
        run: python scripts/coverage_report.py --min 80

  test-frontend:
    name: Frontend Logic Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run built-in JS test runner
        run: node --test tests/js/logic.test.mjs

  test-e2e:
    name: End-to-End Browser Journey
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium

      - name: Run browser E2E test journey
        run: python scripts/run_e2e.py

  docker-build:
    name: Docker Container Build & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build . -t aran:latest

      - name: Test container startup and health probe
        run: |
          docker run -d --name aran-test -p 8000:8000 aran:latest
          sleep 4
          curl -f http://127.0.0.1:8000/api/health || (docker logs aran-test && exit 1)
          docker stop aran-test

  package-build:
    name: Package Distribution Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build source distribution and wheel
        run: python -m build

      - name: Verify build artifacts
        run: ls -la dist/
